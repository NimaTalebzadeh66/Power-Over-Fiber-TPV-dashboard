name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt

      - name: Build one-file Windows application
        shell: pwsh
        run: ./build_windows.ps1

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerOverFiberDashboard-Windows
          path: dist/PowerOverFiberDashboard.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: PowerOverFiberDashboard-Windows
          path: release-assets

      - name: Publish executable to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "release-assets/PowerOverFiberDashboard.exe" --title "$env:GITHUB_REF_NAME" --generate-notes
